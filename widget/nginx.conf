server {
    listen 80;
    server_name localhost;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # JS & CSS files: No-cache revalidation with ETag
    # Forces browser to revalidate with server before using cached copy.
    # Returns 304 Not Modified when unchanged (~0 byte payload, 0ms latency),
    # and 200 OK with fresh code as soon as a new build is deployed.
    location ~* \.(?:js|css|json)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Access-Control-Allow-Origin "*" always;
        etag on;
    }

    # Static images and fonts can be cached longer
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400" always;
        add_header Access-Control-Allow-Origin "*" always;
    }
}
